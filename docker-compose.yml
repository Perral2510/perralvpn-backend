services:
  app:
    build: .
    container_name: perralvpn-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - perralvpn-data:/app/data
      # Put a certificate for payhook.perral.de5.net in this host directory.
      - /etc/sepay/tls:/etc/sepay/tls:ro
    ports:
      # Existing API stays private; SePay IPN is HTTPS directly on public port 3001.
      - "127.0.0.1:3000:3000"
      - "0.0.0.0:3001:3001"

volumes:
  perralvpn-data:
